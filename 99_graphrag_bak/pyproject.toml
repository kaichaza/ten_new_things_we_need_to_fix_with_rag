[project]
name = "graphrag-fruit-graph"
version = "0.1.0"
description = "Corpus-level questions answered via GraphRAG's entity graph and Leiden community summaries"
requires-python = ">=3.12,<3.13"
dependencies = [
    "graphrag==3.1.1",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]
