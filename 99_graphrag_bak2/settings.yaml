# GraphRAG configuration for the fruit shop exercise.
#
# This file is committed on purpose. "graphrag init" would generate one, but
# it prompts interactively, refuses to run when .env exists, and its --force
# flag overwrites .env - destroying the API key. Since every generated value
# was overwritten immediately anyway, keeping the file under version control
# is simpler and reproducible.
#
# No prompt: keys are set, so GraphRAG uses its built-in default prompts.

models:
  default_chat_model:
    type: openai_chat
    api_key: ${GRAPHRAG_API_KEY}
    model: gpt-4.1-mini
    model_supports_json: true
    concurrent_requests: 4
    async_mode: threaded
    max_retries: 5

  default_embedding_model:
    type: openai_embedding
    api_key: ${GRAPHRAG_API_KEY}
    model: text-embedding-3-small
    concurrent_requests: 4
    async_mode: threaded
    max_retries: 5

input:
  type: file
  file_type: text
  base_dir: "input"

chunks:
  size: 400
  overlap: 50
  group_by_columns: [id]

output:
  type: file
  base_dir: "output"

cache:
  type: file
  base_dir: "cache"

reporting:
  type: file
  base_dir: "logs"

vector_store:
  default_vector_store:
    type: lancedb
    db_uri: output/lancedb
    container_name: default
    overwrite: true

embed_text:
  model_id: default_embedding_model
  vector_store_id: default_vector_store

extract_graph:
  model_id: default_chat_model
  entity_types: [person, organization, product, policy, location]
  max_gleanings: 1

summarize_descriptions:
  model_id: default_chat_model
  max_length: 500

community_reports:
  model_id: default_chat_model
  max_length: 2000
  max_input_length: 8000

# Small corpus, so keep communities small enough that Leiden produces more
# than one. The default of 10 collapses this corpus into a single cluster.
cluster_graph:
  max_cluster_size: 6

local_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model

global_search:
  chat_model_id: default_chat_model
