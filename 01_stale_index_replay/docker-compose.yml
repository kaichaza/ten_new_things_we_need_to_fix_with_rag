# Postgres is the operational database (the source of truth for prices).
# The app container builds from the local Dockerfile and reads DATABASE_URL.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fruit
      POSTGRES_PASSWORD: fruit
      POSTGRES_DB: fruitshop
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fruit -d fruitshop"]
      interval: 2s
      timeout: 2s
      retries: 15
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fruit:fruit@db:5432/fruitshop
    depends_on:
      db:
        condition: service_healthy
